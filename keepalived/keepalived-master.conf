# ==============================================================================
# Keepalived Configuration - RHEL 9 NODE 1 (MASTER)
# Install path: /etc/keepalived/keepalived.conf
# Manages HA VIPs atomically:
#   - 1 Inbound VIP (10.10.10.100) for local application servers
#   - Outbound VIPs (10.10.10.101 ..) for 1:1 Hardware Firewall NAT (scale to match .env)
# ==============================================================================

global_defs {
    router_id MAIL_RELAY_NODE1
    enable_script_security
    script_user root
}

vrrp_script chk_postfix {
    script "/etc/keepalived/check_postfix.sh"
    interval 3
    timeout 2
    fall 2
    rise 2
    weight -30
}

vrrp_instance VI_MAILSERVER {
    state MASTER
    # Replace ens192 with your actual RHEL 9 network interface name (check via `ip -br a`)
    interface ens192
    virtual_router_id 55
    priority 110
    advert_int 1

    # Unicast VRRP is recommended on RHEL 9 VMs / enterprise switches
    unicast_src_ip 10.10.10.11
    unicast_peer {
        10.10.10.12
    }

    authentication {
        auth_type PASS
        # Change this password in production (max 8 characters for VRRP PASS)
        auth_pass MailHA99
    }

    # All 6 VIPs fail over together as a single atomic group
    virtual_ipaddress {
        10.10.10.100/24 dev ens192 label ens192:in_vip
        10.10.10.101/24 dev ens192 label ens192:nat_vip1
        10.10.10.102/24 dev ens192 label ens192:nat_vip2
        10.10.10.103/24 dev ens192 label ens192:nat_vip3
        10.10.10.104/24 dev ens192 label ens192:nat_vip4
        10.10.10.105/24 dev ens192 label ens192:nat_vip5
    }

    track_script {
        chk_postfix
    }

    notify "/etc/keepalived/notify.sh"
}
