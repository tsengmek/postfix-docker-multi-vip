# ==============================================================================
# RHEL 9 Kernel Sysctl Configuration for Keepalived + Postfix Multi-VIP HA
# Copy to: /etc/sysctl.d/99-mailserver-sysctl.conf
# Apply with: sudo sysctl --system
# ==============================================================================

# Allow Postfix inside the container (network_mode: host) to bind to the 1 Inbound VIP
# and 5 Outbound Keepalived VIPs even when the node is in BACKUP state.
net.ipv4.ip_nonlocal_bind = 1

# Increase local ephemeral port range for high-throughput outbound SMTP connections
net.ipv4.ip_local_port_range = 10240 65535

# TCP connection handling optimizations for mail relay workloads
net.core.somaxconn = 4096
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
