# Reference logrotate configuration (auto-rendered into /etc/logrotate.d/postfix-mailserver
# by entrypoint.sh using LOG_RETENTION_DAYS and LOG_COMPRESS from .env)

/var/log/mailserver/maillog
/var/log/mailserver/postfix-consolidate.log
{
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    copytruncate
    sharedscripts
    postrotate
        /usr/sbin/postfix reload >/dev/null 2>&1 || true
    endscript
}
